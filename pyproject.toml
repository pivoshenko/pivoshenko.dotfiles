[project]
name = "pivoshenko-dotfiles"
version = "1.0.0"
description = "pivoshenko.dotfiles"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
formatters = ["ruff~=0.17.4"]
linters = ["ruff~=0.17.4", "ty~=0.0.99"]

[tool.ty.environment]
python-version = "3.13"

[tool.ruff]
fix = true
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["COM812", "CPY001", "D", "G004", "INP001", "T201"]
select = ["ALL"]

[tool.ruff.lint.isort]
force-single-line = true
from-first = false
length-sort-straight = true
lines-after-imports = 2
lines-between-types = 1
required-imports = ["from __future__ import annotations"]

# IPython configs patch prompt_toolkit internals through untyped callbacks
[tool.ruff.lint.per-file-ignores]
"dotfiles/**" = ["ANN", "SLF001"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
