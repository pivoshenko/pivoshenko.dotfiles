[project]
name = "pivoshenko-dotfiles"
version = "1.0.0"
description = "pivoshenko.dotfiles"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[dependency-groups]
dev = ["ipdb~=0.13.13", "ipython~=9.19.1"]
formatters = ["ruff~=0.17.6"]
linters = ["ruff~=0.17.6", "ty~=0.0.112"]
tests = [
  "pytest~=9.2.0",
  "pytest-cov~=7.1.0",
  "pytest-mock~=3.17.0",
  "pytest-sugar~=1.1.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100
fix = true
unsafe-fixes = true
format.quote-style = "double"
format.docstring-code-format = true
lint.select = ["ALL"]
lint.ignore = [
  "COM812",
  "CPY001",
  "D101",
  "D102",
  "D103",
  "D107",
  "D203",
  "D213",
  "G004",
  "INP001",
  "T201",
]
# IPython configs patch prompt_toolkit internals through untyped callbacks
lint.per-file-ignores."dotfiles/**" = ["ANN", "SLF001"]
lint.per-file-ignores."tests/**" = ["INP001", "PLR2004", "S101", "SLF001"]
lint.isort.force-single-line = true
lint.isort.from-first = false
lint.isort.length-sort-straight = true
lint.isort.lines-after-imports = 2
lint.isort.lines-between-types = 1
lint.isort.required-imports = ["from __future__ import annotations"]

[tool.ty]
environment.python-version = "3.13"

[tool.pytest]
ini_options.testpaths = ["tests"]
ini_options.addopts = [
  "--color=yes",
  "--cov=dotfiles/.ipython",
  "--cov-report=term-missing",
]

[tool.coverage]
run.omit = ["*/__init__.py"]
