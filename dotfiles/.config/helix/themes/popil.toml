green = "#91ab78"
teal = "#70b2a5"
sky = "#6cb7c0"
sapphire = "#5ba7c5"
blue = "#8da7d1"
lavender = "#b8b9d7"
text = "#e4e2de"
subtext1 = "#b8b3a8"
subtext0 = "#9b958a"
overlay2 = "#a8a29e"
overlay1 = "#78716c"
overlay0 = "#57534e"
surface2 = "#3f3d3b"
surface1 = "#343230"
surface0 = "#2b2926"
base = "#1f1f1e"
mantle = "#1a1a19"
