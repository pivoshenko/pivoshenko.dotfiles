fg_faint = "#78716c"
border_subtle = "#2b2926"
border_default = "#343230"
border_strong = "#3f3d3b"
accent_primary = "#8da7d1"
accent_secondary = "#b8b9d7"
accent_success = "#91ab78"
accent_warning = "#d4aa5c"
accent_danger = "#ec7470"
accent_info = "#5ba7c5"
# == Raw Color Slots ==
rosewater = "#ddc7c2"
flamingo = "#e38191"
pink = "#ce9db9"
mauve = "#ad8cc0"
red = "#ec7470"
