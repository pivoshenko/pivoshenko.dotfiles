fg_faint = "#7d7063"
border_subtle = "#2a2928"
border_default = "#353230"
border_strong = "#413c39"
accent_primary = "#80a6d1"
accent_secondary = "#afb6e9"
accent_success = "#a6bc6a"
accent_warning = "#e2b54c"
accent_danger = "#f7716e"
accent_info = "#52bde2"
# == Raw Color Slots ==
rosewater = "#edbdb4"
flamingo = "#fd87a4"
pink = "#d985c0"
mauve = "#b98dd2"
red = "#f7716e"
