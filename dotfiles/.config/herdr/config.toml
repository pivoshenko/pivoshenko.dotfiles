# == Misc ==
onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
accent = "#d97757"
panel_bg = "#1f1f1e"
sidebar_bg = "#1a1a19"
active_row_bg = "#1f1f1e"
selection_bg = "#262625"
surface0 = "#262625"
surface1 = "#2e2e2c"
surface_dim = "#1a1a19"
overlay0 = "#57534e"
overlay1 = "#78716c"
text = "#e4e2de"
subtext0 = "#9b958a"
mauve = "#b88aa0"
green = "#8a9d68"
yellow = "#d4a85a"
red = "#c87a72"
blue = "#7ba0c4"
teal = "#87a896"
peach = "#d97757"

# == Keys ==
[keys]
prefix = "ctrl+b"

split_horizontal = "prefix+d"
split_vertical = "prefix+r"
close_pane = "prefix+x"
zoom = "prefix+f"
rename_pane = "prefix+c"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+p"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_mode = "prefix+n"
copy_mode = "prefix+["

new_tab = "prefix+shift+n"
rename_tab = "prefix+shift+r"
close_tab = "prefix+shift+x"
previous_tab = "prefix+shift+h"
next_tab = "prefix+shift+l"
switch_tab = "prefix+1..9"

new_workspace = "prefix+alt+n"
rename_workspace = "prefix+alt+r"
close_workspace = "prefix+alt+x"
previous_workspace = "prefix+alt+h"
next_workspace = "prefix+alt+l"
switch_workspace = "prefix+alt+1..9"
new_worktree = "prefix+alt+g"
open_worktree = "prefix+alt+shift+g"
remove_worktree = "prefix+alt+shift+x"

swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+ctrl+j"
swap_pane_up = "prefix+ctrl+k"
swap_pane_right = "prefix+ctrl+l"

previous_agent = "prefix+ctrl+p"
next_agent = "prefix+ctrl+n"
focus_agent = "prefix+ctrl+1..9"

reload_config = "prefix+ctrl+r"

navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_left = "h"
navigate_pane_right = "l"
navigate_pane_down = ""
navigate_pane_up = ""

# == Commands ==
[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+ctrl+e"
type = "shell"
command = 'zed "${HERDR_ACTIVE_PANE_CWD:-.}"'

# == Agent panel ==
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

# == Notifications ==
[ui.toast]
delivery = "system"

# == Plugins ==
[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "herdr-navigator.open"
description = "navigator"
