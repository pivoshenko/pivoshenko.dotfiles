[aws]
symbol = "󰸏 "
force_display = false

[azure]
symbol = " "
disabled = false

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[character]
success_symbol = "[❯](bold blue)"
vimcmd_symbol = "[❮](bold blue)"

[conda]
symbol = " "

[dart]
symbol = " "

[directory]
read_only = "  "
truncation_length = 4
style = "bold blue"

[docker_context]
symbol = "󰡨 "

[dotnet]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[erlang]
symbol = " "

[gcloud]
format = 'on [$symbol$project]($style) '
symbol = " "

[git_branch]
symbol = " "

[git_commit]
tag_symbol = "󰊢 "
tag_disabled = false

[git_metrics]
disabled = false

[git_status]
deleted = "✘ "

[golang]
symbol = " "

[gleam]
symbol = " "

[haskell]
symbol = " "

[hostname]
ssh_only = true
ssh_symbol = " "

[hg_branch]
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[kotlin]
symbol = " "

[kubernetes]
symbol = "󱃾 "
disabled = false

[lua]
symbol = "󰢱 "

[memory_usage]
symbol = "󰍛 "
disabled = true

[meson]
symbol = " "

[nim]
symbol = " "

[nix_shell]
symbol = "󱄅 "

[nodejs]
symbol = "󰎙 "

[openstack]
symbol = " "

[package]
symbol = " "

[php]
symbol = " "

[python]
symbol = " "
style = "green bold"

[rlang]
symbol = "󰟔 "

[ruby]
symbol = " "

[rust]
symbol = " "

[scala]
symbol = " "

[shell]
fish_indicator = ""
style = "lavender bold"
disabled = false

[status]
symbol = " "
success_symbol = ""
not_executable_symbol = " "
map_symbol = false
disabled = false

[swift]
symbol = " "

[terraform]
symbol = "󱁢 "

[custom.hcloud]
description = "Active Hetzner Cloud context"
command = "hcloud context active"
when = 'test -n "$(hcloud context active)"'
symbol = "󰅟 "
format = 'on [$symbol$output]($style) '
style = "red bold"
shell = ["sh"]

[custom.vercel]
description = "Linked Vercel project"
command = 'jq -r ".projectName // .projectId" .vercel/project.json'
detect_folders = [".vercel"]
symbol = "▲ "
format = 'on [$symbol$output]($style) '
style = "bold white"
shell = ["sh"]
