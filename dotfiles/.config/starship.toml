"$schema" = 'https://starship.rs/config-schema.json'

palette = "morok"

[palettes.morok]
# == Semantic Roles ==
bg_canvas = "#111111"
bg_surface = "#181818"
bg_raised = "#212121"
bg_sunken = "#0d0d0d"
bg_overlay = "#57534e"
fg_default = "#e7e5e4"
fg_muted = "#d6d3d1"
fg_subtle = "#a8a29e"
fg_faint = "#78716c"
border_subtle = "#181818"
border_default = "#212121"
border_strong = "#2a2a2a"
accent_primary = "#8da1c7"
accent_secondary = "#babcd8"
accent_success = "#8aaf86"
accent_warning = "#d4b070"
accent_danger = "#df7c7b"
accent_info = "#49a4bf"
# == Raw Color Slots ==
rosewater = "#e2cfc6"
flamingo = "#e6aea0"
pink = "#d4a9ca"
mauve = "#aa89c2"
red = "#df7c7b"
maroon = "#dc99a4"
peach = "#d99a6a"
yellow = "#d4b070"
green = "#8aaf86"
teal = "#58aea8"
sky = "#7fb7bd"
sapphire = "#49a4bf"
blue = "#8da1c7"
lavender = "#babcd8"
text = "#e7e5e4"
subtext1 = "#d6d3d1"
subtext0 = "#a8a29e"
overlay2 = "#a8a29e"
overlay1 = "#78716c"
overlay0 = "#57534e"
surface2 = "#2a2a2a"
surface1 = "#212121"
surface0 = "#181818"
base = "#111111"
mantle = "#0d0d0d"
crust = "#000000"

[aws]
symbol = "󰸏 "
force_display = false

[azure]
symbol = " "
disabled = false

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[character]
success_symbol = "[❯](bold blue)"
vimcmd_symbol = "[❮](bold blue)"

[conda]
symbol = " "

[dart]
symbol = " "

[directory]
read_only = "  "
truncation_length = 4
style = "bold blue"

[docker_context]
symbol = "󰡨 "

[dotnet]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[erlang]
symbol = " "

[gcloud]
format = 'on [$symbol$project]($style) '
symbol = " "

[git_branch]
symbol = " "

[git_commit]
tag_symbol = "󰊢 "
tag_disabled = false

[git_metrics]
disabled = false

[git_status]
deleted = "✘ "

[golang]
symbol = " "

[gleam]
symbol = " "

[haskell]
symbol = " "

[hostname]
ssh_only = true
ssh_symbol = " "

[hg_branch]
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[kotlin]
symbol = " "

[kubernetes]
symbol = "󱃾 "
disabled = false

[lua]
symbol = "󰢱 "

[memory_usage]
symbol = "󰍛 "
disabled = true

[meson]
symbol = " "

[nim]
symbol = " "

[nix_shell]
symbol = "󱄅 "

[nodejs]
symbol = "󰎙 "

[openstack]
symbol = " "

[package]
symbol = " "

[php]
symbol = " "

[python]
symbol = " "
style = "green bold"

[rlang]
symbol = "󰟔 "

[ruby]
symbol = " "

[rust]
symbol = " "

[scala]
symbol = " "

[shell]
fish_indicator = ""
style = "lavender bold"
disabled = false

[status]
symbol = " "
success_symbol = ""
not_executable_symbol = " "
map_symbol = false
disabled = false

[swift]
symbol = " "

[terraform]
symbol = "󱁢 "

[custom.hcloud]
description = "Active Hetzner Cloud context"
command = "hcloud context active"
when = 'test -n "$(hcloud context active)"'
symbol = "󰅟 "
format = 'on [$symbol$output]($style) '
style = "red bold"
shell = ["sh"]

[custom.vercel]
description = "Linked Vercel project"
command = 'jq -r ".projectName // .projectId" .vercel/project.json'
detect_folders = [".vercel"]
symbol = "▲ "
format = 'on [$symbol$output]($style) '
style = "bold white"
shell = ["sh"]
